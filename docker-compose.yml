services:
  unifi-network-mcp:
    image: "${IMAGE_NAME:-unifi-network-mcp:local}"
    build: .
    environment:
      UNIFI_BASE_URL: "https://192.168.1.1/proxy/network/integration"
      UNIFI_API_KEY: "network-integration-api-key"
      READ_ONLY: "true"
      UNIFI_INSECURE_SKIP_VERIFY: "true"
      MCP_CORS_ALLOW_ORIGINS: "https://domain.com"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
